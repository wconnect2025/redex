name = "redex-courier"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# ─── KV Namespace ────────────────────────────────────────────────────────────
# Production: set this in Cloudflare Dashboard →
#   Pages → Your Project → Settings → Functions → KV Namespace Bindings
#   Binding name: REDEX_KV
#
# Local dev (wrangler pages dev):
#   1. Run: npx wrangler kv:namespace create REDEX_KV
#   2. Copy the returned ID into both fields below
# ─────────────────────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "REDEX_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_NAMESPACE_PREVIEW_ID"

# ─── Environment Variables ───────────────────────────────────────────────────
# To change the admin password, set ADMIN_SECRET as an environment variable
# in the Cloudflare Dashboard → Pages → Settings → Environment Variables
# Default password (if not set): redex2025
# ─────────────────────────────────────────────────────────────────────────────
